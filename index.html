<!doctype html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <!-- The municipal seal, cut at the sizes browsers request (npm run images builds these
       from assets-src/seal.png). Small dedicated files rather than the 195 KB master, and
       no SVG "M" placeholder ahead of them — browsers prefer an SVG icon when one is listed. -->
  <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
  <link rel="icon" type="image/png" sizes="48x48" href="/favicon-48.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/favicon-180.png" />
  <meta name="theme-color" content="#00586B" />
  <meta name="color-scheme" content="light" />

  <!-- Fonts are requested from a second origin; warming the connection during HTML
       parse removes a DNS + TLS round trip from first paint on slow mobile links. -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- A capstone prototype, not the LGU's official site: no canonical URL or absolute image
       links, since the municipality's own domain is not this site's address. -->
  <title>Municipality of Magallanes — Capstone Prototype</title>
  <meta name="description" content="Capstone prototype of a website and bilingual (English/Bisaya) chatbot for the Municipality of Magallanes, Agusan del Norte: municipal services, officials, tourism, transparency, and public assistance." />
  <meta name="robots" content="noindex, nofollow" />

  <meta property="og:type" content="website" />
  <meta property="og:site_name" content="Municipality of Magallanes — Capstone Prototype" />
  <meta property="og:title" content="Municipality of Magallanes — Capstone Prototype" />
  <meta property="og:description" content="Capstone prototype of a website and bilingual chatbot for the Municipality of Magallanes, Agusan del Norte." />
  <meta property="og:locale" content="en_PH" />

  <meta name="twitter:card" content="summary" />
  <meta name="twitter:title" content="Municipality of Magallanes — Capstone Prototype" />
  <meta name="twitter:description" content="Capstone prototype of a website and bilingual chatbot for the Municipality of Magallanes, Agusan del Norte." />

  <!-- Structured data: lets search engines render the municipality as a government
       entity with contact details rather than a generic website result. -->
  <script type="application/ld+json">
    {
      "@context": "https://schema.org",
      "@type": "GovernmentOrganization",
      "name": "Municipality of Magallanes",
      "alternateName": "Local Government of Magallanes, Agusan del Norte",
      "areaServed": {
        "@type": "AdministrativeArea",
        "name": "Magallanes, Agusan del Norte, Philippines"
      },
      "address": {
        "@type": "PostalAddress",
        "streetAddress": "Municipal Hall, Barangay Poblacion",
        "addressLocality": "Magallanes",
        "addressRegion": "Agusan del Norte",
        "postalCode": "8604",
        "addressCountry": "PH"
      },
      "contactPoint": [{
        "@type": "ContactPoint",
        "contactType": "Mayor's Office",
        "telephone": "+63-948-623-6977",
        "email": "mayorsoffice2019.magallanesadn@gmail.com",
        "availableLanguage": ["en", "fil", "ceb"]
      }]
    }
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/index.tsx"></script>
</body>

</html>
